name: Dependency security audit

on:
  pull_request:
    paths:
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "pnpm-lock.yaml"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.17.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Detect tracked lockfile
        id: lockfile
        shell: bash
        run: |
          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "tracked=true" >> "$GITHUB_OUTPUT"
          else
            echo "tracked=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Upload bootstrap lockfile when the repository has none
        if: steps.lockfile.outputs.tracked == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock-bootstrap
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 3
      - name: Audit dependency graph
        run: pnpm audit --audit-level high
