name: Dependency security audit

on:
  push:
    branches:
      - security/nodejs-2026-10-21
  pull_request:
    paths:
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "pnpm-lock.yaml"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-security.yml"
      - ".github/workflows/ci.yml"
      - "scripts/audit-dependencies.mjs"
      - "scripts/audit-report-policy.mjs"
      - "scripts/audit-report-policy.test.mjs"
      - "security/dependency-audit-exceptions.json"
      - "packages/taro-template-download-blocked/**"
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "10.17.1"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependency graph
        run: pnpm audit --prod --audit-level high

  node-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "10.17.1"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependency graph
        run: node scripts/audit-dependencies.mjs

  exact-source-security:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact proposed PR source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          echo "security_source_sha=$EXPECTED_SOURCE_SHA"
      - uses: pnpm/action-setup@v6
        with:
          version: '10.17.1'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check exact-source production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Check exact-source full dependency graph
        run: node scripts/audit-dependencies.mjs
