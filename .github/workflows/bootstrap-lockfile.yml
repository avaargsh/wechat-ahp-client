name: One-time pnpm lockfile bootstrap

on:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/nodejs-2026-10-21'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: "10.17.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Generate lockfile without running lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit lockfile and remove this one-time workflow
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/bootstrap-lockfile.yml
          git commit -m "build: refresh reproducible pnpm lockfile"
          git push origin "HEAD:${PR_BRANCH}"
